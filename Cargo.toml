[package]
name = "shh"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A modern SSH: post-quantum hybrid KEX, Ed25519 only, AEAD only"
rust-version = "1.85"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "process", "signal", "fs"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# crypto
ml-kem = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
chacha20 = "0.9"
poly1305 = "0.8"
aes-gcm = "0.10"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }

# encoding / cli
base64 = "0.22"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "shh"
path = "src/bin/shh.rs"

[[bin]]
name = "shhd"
path = "src/bin/shhd.rs"

[profile.release]
lto = "thin"
