[package]
name = "shh"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A modern SSH: post-quantum hybrid KEX, Ed25519 only, AEAD only"
rust-version = "1.85"
# Bins are declared explicitly below; disable auto-discovery so helper source
# files under src/bin/ (e.g. shh_agent_impl.rs) are not treated as targets.
autobins = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "macros", "time", "sync", "process", "signal", "fs"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# crypto
ml-kem = "0.3"
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
chacha20 = { version = "0.10", features = ["legacy"] }
poly1305 = "0.9"
aes-gcm = "0.11"
sha2 = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
# ed25519-dalek 3's SigningKey::generate wants rand_core 0.10's CryptoRng, a
# different (incompatible) trait from our own rand_core 0.6 dependency above.
getrandom = { version = "0.4", features = ["sys_rng"] }
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
bcrypt-pbkdf = "0.11"
aes = "0.9"
ctr = "0.10"

# encoding / cli
base64 = "0.22"
clap = { version = "4", features = ["derive"] }

# pty / terminal / process control (server + unix client bits)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["term", "process", "fs", "signal", "user", "hostname"] }
libc = "0.2"
# tty/unix.rs's winsize()/RawMode converge onto rustils' platform::term::Terminal
# (issue #43); pinned rev, bumped deliberately (see platform-linux's own
# rusty_libc pin for the same convention).
platform = { git = "https://github.com/baileyrd/rustils", rev = "5251808971c2e89164d4461c5cf1f45095f60dd3" }
platform-linux = { git = "https://github.com/baileyrd/rustils", rev = "5251808971c2e89164d4461c5cf1f45095f60dd3" }

# console control for the Windows client (raw mode, echo-off, size)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
criterion = { version = "0.8", features = ["async_tokio"] }

[[bin]]
name = "shh"
path = "src/bin/shh.rs"

[[bin]]
name = "shhd"
path = "src/bin/shhd.rs"

[profile.release]
lto = "thin"

[[bin]]
name = "shh-keygen"
path = "src/bin/shh_keygen.rs"

[[bin]]
name = "shh-agent"
path = "src/bin/shh_agent.rs"

[[bin]]
name = "shh-sftp"
path = "src/bin/shh_sftp.rs"

[[bin]]
name = "shh-id"
path = "src/bin/shh_id.rs"

[[bench]]
name = "cipher"
harness = false

[[bench]]
name = "throughput"
harness = false
