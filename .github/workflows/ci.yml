name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets --locked
      - name: Test
        # Deliberately not --all-targets: that would include the criterion
        # benches, and `cargo test` executes a harness=false bench binary's
        # real main() (a full multi-sample measurement run) rather than
        # skipping it. `cargo build --all-targets` above already compile-checks
        # them; running the actual benchmarks belongs to `cargo bench`, by hand.
        run: cargo test --locked

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  gui:
    name: gui check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: typecheck + build frontend
        working-directory: gui
        run: |
          npm ci
          npm run build
      - name: cargo check (src-tauri)
        # tauri::generate_context!() reads frontendDist (../dist) at compile
        # time, so the frontend build above must run first.
        working-directory: gui/src-tauri
        run: cargo check --locked

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Smoke each fuzz target
        run: |
          for target in wire_reader kexinit_parse cert_parse keyfile_decode ed25519_blob; do
            cargo fuzz run "$target" -- -runs=20000 -max_total_time=30
          done
